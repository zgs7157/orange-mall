<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>橙屿商城 · 管理后台</title>
<meta name="description" content="橙屿商城管理后台：商品新增、编辑、上下架，数据存储于 Cloudflare D1。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23E84E0A'/><text x='32' y='45' font-size='34' text-anchor='middle' fill='%23fff' font-family='serif'>屿</text></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#21201E; --ink-2:#5C5851; --muted:#8A857C; --paper:#FFFDF9; --warm:#F6F1E8;
  --line:#EAE3D5; --brand:#E84E0A; --brand-deep:#C24005; --brand-soft:#FCE8DB;
  --ok:#2E7D4F; --danger:#C0392B; --radius:14px;
  --shadow:0 12px 32px rgba(33,32,30,.10);
  --font-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --font-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-ui);color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.container{max-width:1080px;margin:0 auto;padding:0 20px}

/* 顶栏 */
.site-header{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
.header-inner{display:flex;align-items:center;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px}
.brand svg{width:26px;height:26px;flex:none}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.header-count{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:9px 16px;border-radius:10px;transition:background .15s,transform .15s}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-deep)}
.btn-ghost{border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-danger{background:var(--brand-soft);color:var(--danger)}
.btn-danger:hover{background:#F6D3C8}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}

/* 登录 */
.login-wrap{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:40px 20px}
.login-card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px 30px;box-shadow:var(--shadow)}
.login-card h1{font-family:var(--font-display);font-size:24px;font-weight:900;margin-bottom:6px}
.login-card p{font-size:13px;color:var(--muted);margin-bottom:22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink-2)}
.field input[type=text],.field input[type=number],.field input[type=password],.field input[type=url],.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;transition:border .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.field textarea{min-height:76px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted);margin-top:5px}
.check-row{display:flex;gap:18px;flex-wrap:wrap}
.check-row label{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--ink-2);cursor:pointer}
.check-row input{width:16px;height:16px;accent-color:var(--brand)}

/* 主视图 */
.page{padding:34px 0 64px}
.page-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-family:var(--font-display);font-size:26px;font-weight:900}
.banner{background:var(--warm);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:13px;color:var(--ink-2);margin-bottom:20px}
.banner.error{background:#FBEAE6;border-color:#EFC8BE;color:#8C2F1F}
.banner b{color:var(--ink)}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .spacer{margin-left:auto}

/* 商品表格 */
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
colgroup col.c-img{width:64px}
colgroup col.c-name{width:auto}
colgroup col.c-cat{width:74px}
colgroup col.c-price{width:76px}
colgroup col.c-rate{width:64px}
colgroup col.c-state{width:86px}
colgroup col.c-ops{width:118px}
th,td{padding:12px 10px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line);font-size:13px}
th{background:var(--warm);font-weight:700;color:var(--ink-2);font-size:12px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FDFAF5}
td img.thumb{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--warm);border:1px solid var(--line)}
.t-name{font-weight:600}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--warm);color:var(--ink-2);margin-right:4px}
.tag.new{background:var(--brand-soft);color:var(--brand-deep)}
.tag.off{background:#EFEDE7;color:var(--muted)}
.ops{display:flex;gap:6px;justify-content:flex-end}
.empty-state{text-align:center;padding:56px 20px;color:var(--muted)}
.empty-state svg{width:40px;height:40px;color:#CFC8BA;margin:0 auto 12px;display:block}
.empty-state b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}

/* 弹窗 */
.overlay{position:fixed;inset:0;background:rgba(33,32,30,.45);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:6vh 20px;overflow:auto}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;padding:26px 26px 22px;box-shadow:var(--shadow)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-head h2{font-family:var(--font-display);font-size:20px;font-weight:900}
.modal-close{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .15s,color .15s}
.modal-close:hover{background:var(--warm);color:var(--ink)}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-grid .full{grid-column:1/-1}
.pick-imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pick-imgs img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:2px solid var(--line);cursor:pointer;transition:border .15s}
.pick-imgs img:hover,.pick-imgs img.sel{border-color:var(--brand)}
.preview{width:86px;height:86px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--warm);margin-top:8px;display:none}

/* Toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:14px;padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 隐藏 */
.hide{display:none!important}

@media (max-width:720px){
  .form-grid{grid-template-columns:1fr}
  .page{padding:22px 0 48px}
  .table-wrap{overflow-x:auto}
  table{min-width:640px}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <div class="brand">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#E84E0A"/><text x="32" y="45" font-size="34" text-anchor="middle" fill="#fff" font-family="serif">屿</text></svg>
      橙屿商城 · 管理后台
    </div>
    <div class="header-right">
      <span class="header-count hide" id="countLabel"></span>
      <a class="btn btn-ghost btn-sm" href="./" target="_blank">查看网站</a>
      <button class="btn btn-ghost btn-sm hide" id="logoutBtn">退出登录</button>
    </div>
  </div>
</header>

<!-- ===== 登录视图 ===== -->
<div class="login-wrap" id="loginView">
  <form class="login-card" id="loginForm">
    <h1>欢迎回来</h1>
    <p>输入管理密码进入商品后台</p>
    <div class="field">
      <label for="passwordInput">管理密码</label>
      <input type="password" id="passwordInput" autocomplete="current-password" placeholder="请输入密码">
      <div class="hint">演示默认密码：orange2026（可在 Cloudflare 环境变量 ADMIN_PASSWORD 中修改）</div>
    </div>
    <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center">进入后台</button>
  </form>
</div>

<!-- ===== 主视图 ===== -->
<div class="page hide container" id="mainView">
  <div class="page-head">
    <h1>商品管理</h1>
    <div class="toolbar">
      <div class="spacer"></div>
      <button class="btn btn-primary" id="addBtn">＋ 新增商品</button>
    </div>
  </div>
  <div class="banner error hide" id="dbBanner"></div>
  <div class="table-wrap">
    <table id="productTable">
      <colgroup>
        <col class="c-img"><col class="c-name"><col class="c-cat"><col class="c-price"><col class="c-rate"><col class="c-state"><col class="c-ops">
      </colgroup>
      <thead>
        <tr><th>图片</th><th>名称</th><th>分类</th><th>价格</th><th>评分</th><th>状态</th><th style="text-align:right">操作</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty-state hide" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg>
      <b>还没有商品</b>
      点击右上角「新增商品」开始上架
    </div>
  </div>
</div>

<!-- ===== 编辑弹窗 ===== -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">新增商品</h2>
      <button class="modal-close" id="modalClose" aria-label="关闭"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <form id="productForm">
      <input type="hidden" id="fId">
      <div class="form-grid">
        <div class="field full">
          <label for="fName">商品名称 *</label>
          <input type="text" id="fName" maxlength="40" placeholder="如：轻羽降噪耳机 Pro">
        </div>
        <div class="field">
          <label for="fCat">分类</label>
          <select id="fCat">
            <option value="digital">数码</option>
            <option value="life">生活好物</option>
          </select>
        </div>
        <div class="field">
          <label for="fPrice">价格（元）*</label>
          <input type="number" id="fPrice" min="1" step="1" placeholder="399">
        </div>
        <div class="field">
          <label for="fRating">评分（0–5）</label>
          <input type="number" id="fRating" min="0" max="5" step="0.1" placeholder="4.8">
        </div>
        <div class="field check-row" style="align-items:flex-end">
          <label><input type="checkbox" id="fNew"> 新品</label>
          <label><input type="checkbox" id="fOnSale" checked> 上架</label>
        </div>
        <div class="field full">
          <label for="fImg">图片地址</label>
          <input type="text" id="fImg" placeholder="assets/p01-earbuds.jpg 或 https://…">
          <div class="pick-imgs" id="pickImgs"></div>
          <img class="preview" id="imgPreview" alt="图片预览">
        </div>
        <div class="field full">
          <label for="fDesc">一句话描述</label>
          <input type="text" id="fDesc" maxlength="60" placeholder="入耳式主动降噪，通勤地铁一秒安静。">
        </div>
        <div class="field full">
          <label for="fFeats">卖点（每行一条）</label>
          <textarea id="fFeats" placeholder="蓝牙 5.3 低延迟&#10;单次续航 8 小时"></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" id="cancelBtn">取消</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
/* ===== 状态 ===== */
const $ = (s) => document.querySelector(s);
const loginView = $("#loginView"), mainView = $("#mainView");
const tbody = $("#tbody"), emptyState = $("#emptyState"), dbBanner = $("#dbBanner");
let token = "";
let products = [];
const EXISTING_IMGS = ["assets/p01-earbuds.jpg","assets/p02-watch.jpg","assets/p03-speaker.jpg","assets/p04-keyboard.jpg","assets/p05-bottle.jpg","assets/p06-humidifier.jpg","assets/p07-lamp.jpg","assets/p08-organizer.jpg"];
let toastTimer = null;

function toast(msg){
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

async function api(path, opts = {}){
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(path, Object.assign({ headers }, opts));
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && path !== "/api/login") {
    logout();
    throw new Error("登录已失效，请重新登录");
  }
  return { status: res.status, data };
}

/* ===== 登录 ===== */
$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const password = $("#passwordInput").value.trim();
  if (!password) { toast("请输入密码"); return; }
  const btn = e.target.querySelector("button[type=submit]");
  btn.disabled = true; btn.textContent = "登录中…";
  try {
    const { status, data } = await api("/api/login", { method: "POST", body: JSON.stringify({ password }) });
    if (status === 200 && data.ok) {
      token = data.token;
      try { sessionStorage.setItem("orange-admin-token", token); } catch (err) {}
      enterMain();
    } else {
      toast((data && data.error) || "密码错误");
    }
  } catch (err) {
    toast("无法连接后台服务，请稍后再试");
  }
  btn.disabled = false; btn.textContent = "进入后台";
});

function logout(){
  token = "";
  try { sessionStorage.removeItem("orange-admin-token"); } catch (e) {}
  mainView.classList.add("hide");
  loginView.classList.remove("hide");
  $("#logoutBtn").classList.add("hide");
}
$("#logoutBtn").addEventListener("click", logout);

/* ===== 主视图 ===== */
function enterMain(){
  loginView.classList.add("hide");
  mainView.classList.remove("hide");
  $("#logoutBtn").classList.remove("hide");
  loadList();
}

async function loadList(){
  const { status, data } = await api("/api/products");
  dbBanner.classList.add("hide");
  if (status === 503) {
    dbBanner.classList.remove("hide");
    dbBanner.innerHTML = "<b>数据库尚未配置。</b>" + ((data && data.error) || "");
    tbody.innerHTML = "";
    emptyState.classList.remove("hide");
    return;
  }
  if (!data || !data.ok) { toast("商品加载失败"); return; }
  products = data.products || [];
  renderRows();
}

function renderRows(){
  $("#countLabel").textContent = `共 ${products.length} 件商品`;
  $("#countLabel").classList.remove("hide");
  emptyState.classList.toggle("hide", products.length > 0);
  tbody.innerHTML = products.map(p => {
    const tags = [];
    if (p.isNew) tags.push('<span class="tag new">新品</span>');
    if (!p.on_sale) tags.push('<span class="tag off">已下架</span>');
    if (!tags.length) tags.push('<span class="tag">在售</span>');
    return `<tr data-id="${p.id}">
      <td>${p.image ? `<img class="thumb" src="${esc(p.image)}" alt="">` : '<div style="height:52px"></div>'}</td>
      <td class="t-name">${esc(p.name)}</td>
      <td>${esc(p.catName)}</td>
      <td>¥${p.price}</td>
      <td>${p.rating.toFixed(1)}</td>
      <td>${tags.join("")}</td>
      <td><div class="ops">
        <button class="btn btn-ghost btn-sm" data-edit="${p.id}">编辑</button>
        <button class="btn btn-danger btn-sm" data-del="${p.id}">删除</button>
      </div></td>
    </tr>`;
  }).join("");
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

tbody.addEventListener("click", (e) => {
  const edit = e.target.closest("[data-edit]");
  const del = e.target.closest("[data-del]");
  if (edit) openEdit(parseInt(edit.dataset.edit, 10));
  if (del) removeProduct(parseInt(del.dataset.del, 10));
});

async function removeProduct(id){
  const p = products.find(x => x.id === id);
  if (!p) return;
  if (!confirm(`确定删除「${p.name}」吗？此操作不可恢复。`)) return;
  const { status, data } = await api("/api/products/" + id, { method: "DELETE" });
  if (status === 200) { toast("已删除"); loadList(); }
  else toast((data && data.error) || "删除失败");
}

/* ===== 新增 / 编辑 ===== */
$("#addBtn").addEventListener("click", () => openEdit(null));

function openEdit(id){
  const isEdit = id != null;
  $("#modalTitle").textContent = isEdit ? "编辑商品" : "新增商品";
  const p = isEdit ? products.find(x => x.id === id) : null;
  $("#fId").value = p ? p.id : "";
  $("#fName").value = p ? p.name : "";
  $("#fCat").value = p ? p.category : "digital";
  $("#fPrice").value = p ? p.price : "";
  $("#fRating").value = p ? p.rating : "4.8";
  $("#fNew").checked = p ? !!p.isNew : false;
  $("#fOnSale").checked = p ? !!p.on_sale : true;
  $("#fImg").value = p ? (p.image || "") : "";
  $("#fDesc").value = p ? (p.description || "") : "";
  $("#fFeats").value = p ? (p.feats || []).join("\n") : "";
  buildPicks(p ? p.image : "");
  updatePreview();
  $("#overlay").classList.add("show");
  setTimeout(() => $("#fName").focus(), 60);
}

function buildPicks(cur){
  const box = $("#pickImgs");
  box.innerHTML = EXISTING_IMGS.map(src =>
    `<img src="${src}" data-src="${src}" class="${src === cur ? "sel" : ""}" alt="">`
  ).join("");
  box.querySelectorAll("img").forEach(im => {
    im.addEventListener("click", () => {
      $("#fImg").value = im.dataset.src;
      box.querySelectorAll("img").forEach(x => x.classList.remove("sel"));
      im.classList.add("sel");
      updatePreview();
    });
  });
}

$("#fImg").addEventListener("input", updatePreview);
function updatePreview(){
  const url = $("#fImg").value.trim();
  const img = $("#imgPreview");
  if (url) { img.src = url; img.style.display = "block"; }
  else img.style.display = "none";
}

$("#modalClose").addEventListener("click", closeModal);
$("#cancelBtn").addEventListener("click", closeModal);
$("#overlay").addEventListener("click", (e) => { if (e.target === $("#overlay")) closeModal(); });
function closeModal(){ $("#overlay").classList.remove("show"); }

$("#productForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = $("#fId").value;
  const body = {
    name: $("#fName").value.trim(),
    category: $("#fCat").value,
    catName: $("#fCat").value === "life" ? "生活好物" : "数码",
    price: Number($("#fPrice").value),
    rating: Number($("#fRating").value || 4.8),
    isNew: $("#fNew").checked,
    on_sale: $("#fOnSale").checked,
    image: $("#fImg").value.trim(),
    description: $("#fDesc").value.trim(),
    feats: $("#fFeats").value.split("\n").map(s => s.trim()).filter(Boolean)
  };
  if (!body.name) { toast("请填写商品名称"); return; }
  if (!(body.price > 0)) { toast("请填写正确的价格"); return; }
  const btn = $("#saveBtn");
  btn.disabled = true; btn.textContent = "保存中…";
  try {
    const res = id
      ? await api("/api/products/" + id, { method: "PUT", body: JSON.stringify(body) })
      : await api("/api/products", { method: "POST", body: JSON.stringify(body) });
    if (res.status === 200 || res.status === 201) {
      toast(id ? "已保存" : "已上架");
      closeModal();
      loadList();
    } else {
      toast((res.data && res.data.error) || "保存失败");
    }
  } catch (err) {
    toast("保存失败，请检查网络");
  }
  btn.disabled = false; btn.textContent = "保存";
});

/* ===== 启动 ===== */
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
try { token = sessionStorage.getItem("orange-admin-token") || ""; } catch (e) { token = ""; }
if (token) enterMain();
</script>
